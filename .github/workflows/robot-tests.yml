name: Robot Framework CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-tests:
    name: Test Flask web server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install app and test dependencies
        run: python -m pip install -r requirements.txt

      # Robot waits for /health before testing and fails the job if a test fails.
      - name: Start Flask and run Robot Framework tests
        run: |
          mkdir -p results
          python app.py > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python -m robot --outputdir results --xunit xunit.xml tests

      # Keep the reports available even when a test fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-test-results
          path: results/
          retention-days: 7
          if-no-files-found: warn
